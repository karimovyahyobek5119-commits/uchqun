name: Build Uchqun

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Test uchun APK (debug)
        run: gradle :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: uchqun-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # Play Market uchun imzolangan AAB. Faqat Secrets qo'shilgan bo'lsa ishlaydi.
      - name: Kalitni tiklash
        if: ${{ env.KS != '' }}
        run: echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Play Market uchun AAB (release)
        if: ${{ env.KS != '' }}
        env:
          UPLOAD_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: gradle :app:bundleRelease

      - uses: actions/upload-artifact@v4
        if: ${{ env.KS != '' }}
        with:
          name: uchqun-release-aab
          path: app/build/outputs/bundle/release/*.aab
