plugins { id "com.android.application" }

android {
    namespace "uz.yahyobek.uchqun"
    compileSdk 36

    defaultConfig {
        applicationId "uz.yahyobek.uchqun"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.1"
    }

    // Release imzosi GitHub Secrets orqali beriladi (README'ga qarang)
    signingConfigs {
        release {
            def ks = System.getenv("UPLOAD_KEYSTORE_PATH")
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv("UPLOAD_KEYSTORE_PASSWORD")
                keyAlias System.getenv("UPLOAD_KEY_ALIAS")
                keyPassword System.getenv("UPLOAD_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv("UPLOAD_KEYSTORE_PATH")) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
