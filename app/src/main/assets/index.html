<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><style>[hidden]{display:none!important}</style></head><body>
<title>Uchqun</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Rubik:wght@800&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Layout: mobile game shell — fixed top HUD, one screen per tab, fixed bottom tab bar; each world recolors every token */
:root{
  --bg1:#061A33; --bg2:#0B3A5C; --bg3:#0E5E73;
  --panel:rgba(255,255,255,.09); --panel2:rgba(255,255,255,.16); --line:rgba(255,255,255,.18);
  --board:#0A2A45; --socket:#12405F; --ink:#F2FAFF; --muted:#9EC3D8; --gold:#FFC93C; --accent:#3FE0D0; --accentInk:#032B33;
  --U:#FF5D73; --R:#FFB23F; --D:#3FE0A0; --L:#8B7BFF;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg1);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none}
#sky{position:fixed;inset:0;background:linear-gradient(170deg,var(--bg1),var(--bg2) 55%,var(--bg3));transition:background .6s}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.shell{position:relative;height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto}
/* HUD */
.hud{display:flex;align-items:center;gap:10px;padding:12px 16px 6px}
.logo{font-family:var(--display);font-size:1.7rem;letter-spacing:.02em;line-height:1;text-shadow:0 3px 0 rgba(0,0,0,.35)}
.logo span{color:var(--gold)}
.pill{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 6px;font-weight:900;font-variant-numeric:tabular-nums}
.coin{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF2A8,var(--gold) 55%,#C98A00);box-shadow:inset 0 -2px 0 rgba(0,0,0,.25);display:inline-grid;place-items:center;font:900 .7rem var(--body);color:#7A4B00;flex:none}
.sp{flex:1}
/* screens */
main{flex:1;min-height:0;overflow-y:auto;padding:4px 16px 16px;scrollbar-width:none}
main::-webkit-scrollbar{display:none}
.screen{display:flex;flex-direction:column;gap:14px}
h2{font-family:var(--display);font-weight:400;font-size:1.7rem;margin:4px 0 0;letter-spacing:.01em;text-shadow:0 3px 0 rgba(0,0,0,.3)}
.sub{color:var(--muted);font-weight:700;margin:-8px 0 0;font-size:.92rem}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;backdrop-filter:blur(6px)}
/* game */
.lvhead{display:flex;align-items:center;gap:10px}
.lvtitle{font-family:var(--display);font-size:1.9rem;line-height:1;text-shadow:0 3px 0 rgba(0,0,0,.35)}
.lvtitle small{display:block;font:800 .78rem var(--body);color:var(--muted);letter-spacing:.06em;text-transform:uppercase;text-shadow:none;margin-bottom:2px}
.mv{margin-left:auto;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 12px;font-variant-numeric:tabular-nums}
.mv b{font-family:var(--display);font-size:1.4rem;display:block;line-height:1;font-weight:400}
.mv small{font-size:.66rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.dots{display:flex;gap:5px}
.dots i{flex:1;height:7px;border-radius:9px;background:var(--panel2)}
.dots i.done{background:var(--gold)}.dots i.cur{background:var(--accent)}
.bwrap{position:relative;width:100%;max-width:460px;margin:0 auto}
.board{position:relative;width:100%;aspect-ratio:1;background:var(--board);border-radius:24px;box-shadow:0 8px 0 rgba(0,0,0,.3),inset 0 0 0 2px var(--line);overflow:hidden;--pad:10px}
.sock{position:absolute;left:var(--pad);top:var(--pad);width:var(--cs);height:var(--cs);transform:translate(calc(var(--c)*var(--cs)),calc(var(--r)*var(--cs)))}
.sock::after{content:"";position:absolute;inset:calc(var(--cs)*.38);border-radius:50%;background:var(--socket)}
.tok{position:absolute;left:var(--pad);top:var(--pad);width:var(--cs);height:var(--cs);padding:calc(var(--cs)*.06);border:0;background:none;cursor:pointer;touch-action:manipulation;
  transform:translate(calc(var(--c)*var(--cs)),calc(var(--r)*var(--cs)));transition-property:transform,opacity;transition-timing-function:cubic-bezier(.3,.7,.3,1)}
.tok i{display:grid;place-items:center;width:100%;height:100%;border-radius:28%;
  background:linear-gradient(180deg,color-mix(in srgb,var(--col) 78%,#fff 22%),var(--col) 60%);
  box-shadow:0 calc(var(--cs)*.07) 0 color-mix(in srgb,var(--col) 55%,#000 45%),inset 0 2px 0 rgba(255,255,255,.45);transition:transform .12s}
.tok svg{width:62%;height:62%;filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
.tok.U{--col:var(--U)}.tok.R{--col:var(--R)}.tok.D{--col:var(--D)}.tok.L{--col:var(--L)}
.tok.U svg{transform:rotate(-90deg)}.tok.D svg{transform:rotate(90deg)}.tok.L svg{transform:rotate(180deg)}
.tok svg{transition:transform .2s}
.tok:active i{transform:translateY(2px)}
.tok:focus-visible{outline:none}.tok:focus-visible i{outline:3px solid #fff;outline-offset:2px}
.tok.gone{opacity:0;pointer-events:none}
.tok.shake i{animation:shake .3s}.tok.bump i{animation:bump .25s}.tok.glow i{animation:glow .5s 3}
.tok.boom i{animation:boom .35s forwards}
.board.aim .tok i{outline:3px dashed rgba(255,255,255,.7);outline-offset:2px}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes bump{50%{transform:scale(.84)}}
@keyframes glow{50%{transform:scale(1.14);filter:brightness(1.3)}}
@keyframes boom{to{transform:scale(1.6);opacity:0}}
.aimtip{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--gold);color:#3A2600;font-weight:900;font-size:.85rem;padding:6px 12px;border-radius:999px;white-space:nowrap;z-index:3}
.power{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.pw{position:relative;border:0;border-radius:16px;background:var(--panel2);color:var(--ink);padding:10px 4px 8px;font:800 .72rem var(--body);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.pw svg{width:26px;height:26px}
.pw:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.pw:disabled{opacity:.4}
.pw.on{background:var(--gold);color:#3A2600}
.pw .n{position:absolute;top:-6px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--U);color:#fff;font:900 .72rem/20px var(--body);padding:0 5px;box-shadow:0 2px 0 rgba(0,0,0,.3)}
.pw .n.plus{background:var(--accent);color:var(--accentInk)}
.pw:focus-visible,.btn:focus-visible,.tab:focus-visible,.node:focus-visible{outline:3px solid #fff;outline-offset:2px}
.hint{font-size:.86rem;color:var(--muted);font-weight:700;text-align:center;margin:0}
/* buttons */
.btn{border:0;border-radius:16px;padding:13px 18px;font:900 1rem var(--body);cursor:pointer;background:var(--accent);color:var(--accentInk);box-shadow:0 5px 0 color-mix(in srgb,var(--accent) 50%,#000 50%)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 color-mix(in srgb,var(--accent) 50%,#000 50%)}
.btn.gold{background:var(--gold);color:#3A2600;box-shadow:0 5px 0 #A06E00}
.btn.ghost{background:var(--panel2);color:var(--ink);box-shadow:0 5px 0 rgba(0,0,0,.25)}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{padding:9px 14px;font-size:.88rem;border-radius:13px}
/* map */
.stagecard{display:flex;flex-direction:column;gap:12px}
.stagehd{display:flex;align-items:center;gap:10px}
.stagehd b{font-family:var(--display);font-weight:400;font-size:1.35rem}
.chip{font-size:.72rem;font-weight:900;padding:4px 9px;border-radius:999px;background:var(--panel2);color:var(--muted);letter-spacing:.04em}
.chip.gold{background:var(--gold);color:#3A2600}
.path{display:grid;grid-template-columns:repeat(5,1fr);gap:12px 8px}
.node{aspect-ratio:1;border-radius:50%;border:0;display:grid;place-items:center;font:400 1.25rem var(--display);color:var(--ink);background:var(--panel2);cursor:pointer;position:relative;box-shadow:0 5px 0 rgba(0,0,0,.28);line-height:1}
.node small{position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);font:900 .62rem var(--body);color:var(--gold);white-space:nowrap;text-shadow:0 1px 0 rgba(0,0,0,.5)}
.node.done{background:linear-gradient(180deg,color-mix(in srgb,var(--D) 80%,#fff 20%),var(--D));color:#062B1C}
.node.cur{background:var(--gold);color:#3A2600;animation:pulse 1.4s infinite}
.node.boss{border-radius:30%}
.node:disabled{opacity:.45;cursor:default}
@keyframes pulse{50%{transform:scale(1.08)}}
.locked{display:flex;align-items:center;gap:14px;opacity:.75}
.lockic{width:46px;height:46px;border-radius:14px;background:var(--panel2);display:grid;place-items:center;font:400 1.4rem var(--display);flex:none}
.oldst{display:flex;flex-wrap:wrap;gap:8px}
/* shop */
.item{display:flex;align-items:center;gap:14px}
.item .ic{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;flex:none;background:var(--panel2)}
.item .ic svg{width:32px;height:32px}
.item .tx{flex:1;min-width:0}
.item .tx b{display:block;font-size:1.05rem}
.item .tx span{font-size:.85rem;color:var(--muted);font-weight:700}
.have{font-size:.75rem;font-weight:900;color:var(--accent)}
.price{display:inline-flex;align-items:center;gap:5px}
.price .coin{width:18px;height:18px;font-size:.6rem}
/* themes */
.tgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.tcard{border-radius:20px;overflow:hidden;border:2px solid var(--line);display:flex;flex-direction:column;cursor:pointer;background:var(--panel);padding:0;color:var(--ink);font-family:var(--body);text-align:left}
.tcard.sel{border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 40%,transparent)}
.tprev{aspect-ratio:16/10;display:grid;place-items:center;position:relative}
.mini{display:grid;grid-template-columns:repeat(3,18px);gap:5px;padding:8px;border-radius:12px}
.mini i{width:18px;height:18px;border-radius:6px}
.tinfo{padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.tinfo b{font-size:.98rem}
.tinfo span{font-size:.78rem;font-weight:800;color:var(--muted);display:flex;align-items:center;gap:5px}
/* friends */
.code{font-family:var(--display);font-size:2rem;letter-spacing:.12em;text-align:center;background:var(--board);border-radius:14px;padding:12px;border:2px dashed var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1}
input.in{font:900 1.05rem var(--body);letter-spacing:.1em;text-transform:uppercase;background:var(--board);color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:11px 12px;min-width:0;width:100%;box-sizing:border-box}
input.in:focus{outline:none;border-color:var(--accent)}
.steps{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.steps li{display:flex;gap:12px;align-items:center;font-weight:700;font-size:.92rem}
.steps li i{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accentInk);font:400 1rem var(--display);display:grid;place-items:center;flex:none;font-style:normal}
.demo{font-size:.76rem;color:var(--muted);font-weight:700;margin:0}
/* creator */
.me{display:flex;gap:14px;align-items:center}
.ava{width:70px;height:70px;border-radius:22px;background:linear-gradient(135deg,var(--U),var(--R));display:grid;place-items:center;font:400 1.8rem var(--display);color:#fff;flex:none;box-shadow:0 5px 0 rgba(0,0,0,.3)}
.me b{font-family:var(--display);font-weight:400;font-size:1.45rem;display:block;line-height:1.1}
.me span{color:var(--muted);font-weight:700;font-size:.9rem}
.links{display:flex;flex-direction:column;gap:8px}
.lnk{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--panel2);color:var(--ink);text-decoration:none;font-weight:800}
.lnk em{margin-left:auto;font-style:normal;color:var(--muted);font-size:.8rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.rate{display:flex;justify-content:center;gap:6px}
.rate button{border:0;background:none;font-size:2.3rem;cursor:pointer;color:var(--panel2);padding:0 2px;line-height:1;transition:transform .15s}
.rate button.on{color:var(--gold);text-shadow:0 3px 0 #A06E00}
.rate button:hover{transform:scale(1.12)}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stat3 b{font-family:var(--display);font-weight:400;font-size:1.5rem;display:block}
.stat3 span{font-size:.72rem;font-weight:800;color:var(--muted);text-transform:uppercase}
/* tabbar */
nav{display:grid;grid-template-columns:repeat(6,1fr);gap:2px;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:rgba(0,0,0,.35);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.tab{border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;font:800 .64rem var(--body);cursor:pointer;padding:6px 0;border-radius:12px;position:relative}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--ink);background:var(--panel2)}
.tab .badge{position:absolute;top:2px;right:18%;width:9px;height:9px;border-radius:50%;background:var(--U)}
/* overlays */
.ov{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);padding:16px}
.modal{background:linear-gradient(180deg,var(--bg2),var(--bg1));border:2px solid var(--line);border-radius:26px;padding:24px 20px;width:100%;max-width:340px;box-sizing:border-box;text-align:center;display:flex;flex-direction:column;gap:12px;animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.modal h3{font-family:var(--display);font-weight:400;font-size:2.1rem;margin:0;line-height:1;text-shadow:0 3px 0 rgba(0,0,0,.35)}
.bigstars{font-size:2.8rem;letter-spacing:.1em;line-height:1}
.bigstars .s{color:var(--gold);text-shadow:0 4px 0 #A06E00;display:inline-block;animation:starin .4s backwards}
.bigstars .s:nth-child(2){animation-delay:.15s}.bigstars .s:nth-child(3){animation-delay:.3s}
.bigstars .o{color:rgba(255,255,255,.15)}
@keyframes starin{from{transform:scale(0) rotate(-90deg)}}
.reward{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.rw{display:flex;align-items:center;gap:6px;background:var(--panel2);border-radius:999px;padding:6px 12px 6px 6px;font-weight:900}
.rw svg{width:22px;height:22px}
.chest{font-size:4.5rem;line-height:1;cursor:pointer;background:none;border:0;animation:wobble 1.2s infinite}
@keyframes wobble{0%,100%{transform:rotate(0)}20%{transform:rotate(-8deg)}40%{transform:rotate(8deg)}60%{transform:rotate(-4deg)}}
.modal p{margin:0;color:var(--muted);font-weight:700}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg1);font-weight:900;padding:10px 16px;border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.35);max-width:88vw;text-align:center;animation:pop .3s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:0s!important}}
/* additions */
:root{--display:"Lilita One","Rubik","Arial Rounded MT Bold",system-ui,sans-serif}
.hb{width:40px;height:40px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);display:grid;place-items:center;cursor:pointer;position:relative;flex:none;padding:0}
.hb svg{width:22px;height:22px}
.hb .badge,.tab .badge{position:absolute;top:4px;right:4px;width:10px;height:10px;border-radius:50%;background:var(--U);box-shadow:0 0 0 2px var(--bg1)}
.hb:focus-visible{outline:3px solid #fff;outline-offset:2px}
.hud .pill{order:0}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--muted);font:800 .9rem var(--body);cursor:pointer;padding:0;align-self:flex-start}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{border:0;border-radius:20px;padding:14px;text-align:left;color:#fff;cursor:pointer;display:flex;flex-direction:column;gap:6px;box-shadow:0 5px 0 rgba(0,0,0,.3);font-family:var(--body);min-width:0}
.mode b{font-family:var(--display);font-weight:400;font-size:1.25rem;line-height:1.05}
.mode span{font-size:.78rem;font-weight:800;opacity:.9}
.mode em{font-style:normal;font-size:.72rem;font-weight:900;background:rgba(0,0,0,.25);border-radius:999px;padding:3px 9px;align-self:flex-start}
.mode.daily{background:linear-gradient(150deg,var(--R),var(--U))}
.mode.rush{background:linear-gradient(150deg,var(--L),var(--accent))}
.mode:disabled{filter:saturate(.4);opacity:.75;cursor:default}
.timer{font-family:var(--display);font-size:1.5rem;line-height:1}
.tbar{height:8px;border-radius:9px;background:var(--panel2);overflow:hidden}
.tbar i{display:block;height:100%;background:linear-gradient(90deg,var(--U),var(--R));transition:width 1s linear}
.ach{display:flex;gap:12px;align-items:center}
.ach .ai{width:46px;height:46px;border-radius:14px;background:var(--panel2);display:grid;place-items:center;font-size:1.4rem;flex:none}
.ach.done .ai{background:var(--gold)}
.ach .tx{flex:1;min-width:0}
.ach .tx b{display:block;font-size:.98rem}
.ach .tx span{font-size:.8rem;color:var(--muted);font-weight:700}
.pbar{height:6px;border-radius:6px;background:var(--panel2);margin-top:6px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent)}
.langs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lang{border:2px solid var(--line);border-radius:16px;background:var(--panel2);color:var(--ink);font:900 1rem var(--body);padding:12px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.lang small{font-weight:700;color:var(--muted);font-size:.75rem}
.lang.on{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 22%,transparent)}
.set{display:flex;align-items:center;gap:12px;padding:6px 0}
.set b{flex:1;font-size:1rem}
.sw{width:54px;height:32px;border-radius:16px;border:0;background:var(--panel2);position:relative;cursor:pointer;flex:none;padding:0}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.sw.on{background:var(--accent)}.sw.on::after{transform:translateX(22px)}
.sw:focus-visible,.lang:focus-visible,.mode:focus-visible{outline:3px solid #fff;outline-offset:2px}
.danger{background:var(--U)!important;color:#fff!important;box-shadow:0 5px 0 color-mix(in srgb,var(--U) 50%,#000 50%)!important}
.tut{display:flex;flex-direction:column;gap:12px;align-items:center}
.tutpic{display:flex;gap:6px;align-items:center;justify-content:center;background:var(--board);border-radius:18px;padding:14px 16px}
.tutpic .t{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;box-shadow:0 4px 0 rgba(0,0,0,.3)}
.tutpic .t svg{width:62%;height:62%}
.tutpic .gap{width:40px;height:40px;display:grid;place-items:center;color:var(--muted);font-weight:900}
.tdots{display:flex;gap:6px;justify-content:center}.tdots i{width:8px;height:8px;border-radius:50%;background:var(--panel2)}.tdots i.on{background:var(--gold);width:22px;border-radius:5px}
</style>
<div id="sky"></div>
<canvas id="fx"></canvas>
<div class="shell">
  <div class="hud">
    <div class="logo">Uch<span>qun</span></div>
    <div class="sp"></div>
    <button class="hb" id="achb"></button>
    <div class="pill" id="coinp"><span class="coin">$</span><span id="coins">0</span></div>
    <button class="hb" id="setb"></button>
  </div>
  <main id="main"></main>
  <nav id="nav"></nav>
</div>
<div id="ovl"></div>
<script>
/* ================= i18n ================= */
const LANGS=[["uz","O'zbekcha","Lotin"],["cy","Ўзбекча","Кирилл"],["en","English","English"],["ru","Русский","Русский"]];
const T={
 tab_play:["O'yin","Ўйин","Play","Игра"],
 tab_map:["Bosqichlar","Босқичлар","Stages","Этапы"],
 tab_shop:["Do'kon","Дўкон","Shop","Магазин"],

const DIR={U:[-1,0],D:[1,0],L:[0,-1],R:[0,1]},ROT={U:"R",R:"D",D:"L",L:"U"};
const stageOf=n=>Math.ceil(n/10);
function sizeOf(s){return s===1?4:s<=3?5:s<=6?6:s<=10?7:s<=16?8:9}
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let x=Math.imul(seed^seed>>>15,1|seed);x=x+Math.imul(x^x>>>7,61|x)^x;return((x^x>>>14)>>>0)/4294967296}}
function build(seed,s,k,fixed){const N=sizeOf(s),R=rng(seed);let dens=Math.min(.8,.30+s*.028+k*.014+(k===10?.07:0));let target=fixed||Math.round(N*N*dens);
  const occ=Array.from({length:N},()=>Array(N).fill(0)),out=[];
  const clear=(r,c,d)=>{const[dr,dc]=DIR[d];r+=dr;c+=dc;while(r>=0&&r<N&&c>=0&&c<N){if(occ[r][c])return false;r+=dr;c+=dc}return true};
  for(let i=0;i<8000&&out.length<target;i++){const r=Math.floor(R()*N),c=Math.floor(R()*N);if(occ[r][c])continue;
    for(const d of["U","D","L","R"].sort(()=>R()-.5))if(clear(r,c,d)){occ[r][c]=1;out.push([r,c,d]);break}}
  return{N,a:out,par:out.length,stage:s,k,boss:k===10}}
function gen(n){const s=stageOf(n),k=(n-1)%10+1;return build(n*9973+77,s,k,n<=3?2+n:0)}

const cv=$("#fx"),cx=cv.getContext("2d");let parts=[],fxType="",fxRAF=0;const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
function fxInit(ty){fxType=ty;const W=cv.width=innerWidth*devicePixelRatio,H=cv.height=innerHeight*devicePixelRatio;parts=[];
  const n={bubbles:34,sparks:40,fireflies:30,snow:60,stars:110,confetti:44}[ty];
  for(let i=0;i<n;i++)parts.push({x:Math.random()*W,y:Math.random()*H,r:Math.random(),v:Math.random(),p:Math.random()*6.28});cancelAnimationFrame(fxRAF);loop()}
function loop(){const W=cv.width,H=cv.height,d=devicePixelRatio;cx.clearRect(0,0,W,H);const tm=performance.now()/1000;
  for(const q of parts){
    if(fxType==="bubbles"){q.y-=(.3+q.v*.8)*d;q.x+=Math.sin(tm+q.p)*.3*d;if(q.y<-20)q.y=H+20;cx.strokeStyle="rgba(170,230,255,.35)";cx.lineWidth=1.5*d;cx.beginPath();cx.arc(q.x,q.y,(2+q.r*7)*d,0,6.28);cx.stroke()}

    else if(fxType==="fireflies"){q.x+=Math.cos(tm*.6+q.p)*.5*d;q.y+=Math.sin(tm*.7+q.p*2)*.4*d;const a=.25+.75*Math.abs(Math.sin(tm*1.3+q.p));const g=cx.createRadialGradient(q.x,q.y,0,q.x,q.y,8*d);g.addColorStop(0,`rgba(220,255,140,${a})`);g.addColorStop(1,"rgba(220,255,140,0)");cx.fillStyle=g;cx.beginPath();cx.arc(q.x,q.y,8*d,0,6.28);cx.fill()}

function layout(){const b=$("#board");if(!b||!L)return;b.style.setProperty("--cs",(b.clientWidth-20)/L.N+"px")}
function place(a,dur,delay){const e=els[a.id];if(!e)return;e.style.transitionDuration=dur+"ms";e.style.transitionDelay=(delay||0)+"ms";e.style.setProperty("--r",a.r);e.style.setProperty("--c",a.c);
  e.className="tok "+a.d+(a.alive?"":" gone");e.tabIndex=a.alive?0:-1;e.setAttribute("aria-label",t("arrow")+" "+t("dir_"+a.d))}
function upd(){const m=$("#mvn");if(m)m.textContent=moves;const p=$("#parn");if(p)p.textContent=par();const u=$("#undo");if(u)u.disabled=!hist.length}
const inside=(r,c)=>r>=0&&r<L.N&&c>=0&&c<L.N,at=(r,c)=>arrows.find(a=>a.alive&&a.r===r&&a.c===c);
const snap=()=>hist.push({a:JSON.parse(JSON.stringify(arrows)),moves,bombsUsed});
function tap(id){if(busy)return;const A=arrows.find(a=>a.id===id);if(!A||!A.alive)return;if(aim){useAim(A);return}
  const[dr,dc]=DIR[A.d];let r=A.r+dr,c=A.c+dc,hit=null;while(inside(r,c)){const h=at(r,c);if(h){hit=h;break}r+=dr;c+=dc}
  if(!hit){snap();const dist=Math.abs(r-A.r)+Math.abs(c-A.c);A.r=r+dr;A.c=c+dc;A.alive=false;moves++;upd();sfx("fly");buzz(12);const d=Math.max(170,dist*65);place(A,d);after(d);return}
  const nr=hit.r-dr,nc=hit.c-dc,moved=nr!==A.r||nc!==A.c,dist=Math.abs(nr-A.r)+Math.abs(nc-A.c),pr=hit.r+dr,pc=hit.c+dc;let push=null;
  if(!inside(pr,pc))push={r:pr+dr,c:pc+dc,alive:false};else if(!at(pr,pc))push={r:pr,c:pc,alive:true};
  if(!moved&&!push){const e=els[A.id];e.classList.remove("shake");void e.offsetWidth;e.classList.add("shake");sfx("bad");buzz(40);return}
  snap();A.r=nr;A.c=nc;if(push)Object.assign(hit,push);moves++;upd();
  const t1=moved?Math.max(120,dist*65):60;place(A,t1);const he=els[hit.id];if(push)place(hit,hit.alive?140:230,t1);
  setTimeout(()=>{sfx("push");buzz(20);he.classList.add("bump");setTimeout(()=>he.classList.remove("bump"),260)},t1);after(t1+(push?230:0))}
function after(d){busy=true;setTimeout(()=>{busy=false;if(arrows.every(a=>!a.alive))win()},d+40)}
function undo(){if(busy||!hist.length)return;const h=hist.pop();h.a.forEach(o=>Object.assign(arrows.find(a=>a.id===o.id),o));moves=h.moves;bombsUsed=h.bombsUsed;arrows.forEach(a=>place(a,160));upd()}
function freeArrow(){return arrows.find(a=>{if(!a.alive)return false;const[dr,dc]=DIR[a.d];let r=a.r+dr,c=a.c+dc;while(inside(r,c)){if(at(r,c))return false;r+=dr;c+=dc}return true})}
function power(p){if(busy)return;if(!S.items[p]){toast(t("out"));go("shop");return}

  aim=aim===p?null:p;refreshPower();aimTip()}
function refreshPower(){document.querySelectorAll(".pw[data-p]").forEach(b=>{const id=b.dataset.p,n=S.items[id]||0;b.classList.toggle("on",aim===id);const s=b.querySelector(".n");s.textContent=n||"+";s.className="n"+(n?"":" plus")})}
function useAim(A){const p=aim;aim=null;S.items[p]--;save();snap();
  if(p==="rot"){A.d=ROT[A.d];place(A,0);sfx("rot")}
  else{bombsUsed++;S.bombs++;save();sfx("boom");buzz(60);const e=els[A.id];e.classList.add("boom");busy=true;setTimeout(()=>{e.classList.remove("boom");A.alive=false;place(A,0);busy=false;if(arrows.every(a=>!a.alive))win()},340)}
  aimTip();refreshPower();upd()}

  $("#rs").onclick=()=>{$("#rz").innerHTML=`<p style="margin:0;font-weight:800">${t("resetq")}</p><div class="row"><button class="btn danger" id="y">${t("yesreset")}</button><button class="btn ghost" id="n">${t("cancel")}</button></div>`;
    $("#n").onclick=drawSettings;$("#y").onclick=()=>{const keep={lang:S.lang,tut:true,sound:S.sound,vibro:S.vibro};S=Object.assign(fresh(),keep);save();L=null;mode="main";applyWorld();hud();go("play")}}}
/* ================= onboarding ================= */
function pickLang(done){modal(`<h3>${t("pickl")}</h3>${langGrid()}`,m=>m.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{setLang(b.dataset.l);close();done()}))}
function tutorial(i){const tok=(d,col)=>`<span class="t" style="background:var(--${col})"><span style="display:grid;place-items:center;width:100%;height:100%;transform:rotate(${{R:0,D:90,L:180,U:-90}[d]}deg)">${I.arrow}</span></span>`;
  const pics=[`${tok("R","R")}<span class="gap">→</span><span class="gap">→</span><span class="gap">✨</span>`,`${tok("R","R")}<span class="gap">→</span>${tok("U","U")}<span class="gap">→</span>`,`<span class="gap" style="font-size:1.8rem;color:var(--gold)">★★★</span>`];
  modal(`<div class="tut"><div class="tutpic">${pics[i]}</div><h3>${t("tut"+(i+1)+"t")}</h3><p>${t("tut"+(i+1))}</p><div class="tdots">${[0,1,2].map(j=>`<i class="${j===i?"on":""}"></i>`).join("")}</div>
   <button class="btn gold" id="tn" style="align-self:stretch">${t(i<2?"tnext":"tgo")}</button></div>`,m=>m.querySelector("#tn").onclick=()=>{if(i<2)tutorial(i+1);else{S.tut=true;save();close();go("play")}})}
/* ================= boot ================= */
window.claude?.hot?.snapshot?.(()=>({tab:tab==="play"||TABS.includes(tab)?tab:"play"}));
function start(d){applyWorld();document.documentElement.lang=S.lang==="cy"?"uz-Cyrl":(S.lang||"uz");
  $("#achb").onclick=()=>go("ach");$("#setb").onclick=()=>go("settings");
  if(!S.lang){S.lang="uz";hud();nav();go("play");pickLang(()=>{go("play");if(!S.tut)tutorial(0)});return}
  hud();tab=(d&&d.tab)||"play";nav();go(tab);if(!S.tut)tutorial(0)}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});

</script>

</body></html>
